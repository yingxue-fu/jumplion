[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "jumplion"
requires-python = ">=3.12"
dynamic = ["version", "dependencies", "optional-dependencies"]
authors = [
  { name="Yingxue Fu", email="yingxue.fu@stjude.org" },
]
description = "A software for DIA-MS quantification"
readme = "README.md"
license = "Apache-2.0"
keywords = ["proteomics", "DIA", "mass spectrometry", "single-cell", "quantification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
jumplion = "jumplion.main:main"
jumplion-viewer = "jumplion.gui.index_tabs:main"

[project.urls]
"Homepage" = "https://github.com/yingxue-fu/jumplion"
"Issues" = "https://github.com/yingxue-fu/jumplion/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"jumplion.gui.assets" = ["*"]
"jumplion.ext" = ["*"]

[tool.setuptools.packages.find]
include = ["jumplion*"]  # Only include jumplion package

[tool.setuptools.dynamic]
version = {attr = "jumplion.__version__"}
dependencies = {file = ["requirements/requirements.txt"]}
optional-dependencies.gui = { file = ["requirements/requirements_gui.txt"] }

[tool.cibuildwheel]
build = "cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
